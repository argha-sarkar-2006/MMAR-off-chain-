<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop stopColor="#090d16" />
      <stop offset="1" stopColor="#1e293b" />
    </linearGradient>
    <linearGradient id="routeCyan" x1="16" y1="12" x2="38" y2="12" gradientUnits="userSpaceOnUse">
      <stop stopColor="#38bdf8" />
      <stop offset="1" stopColor="#0ea5e9" />
    </linearGradient>
    <linearGradient id="routeIndigo" x1="16" y1="24" x2="38" y2="24" gradientUnits="userSpaceOnUse">
      <stop stopColor="#818cf8" />
      <stop offset="1" stopColor="#6366f1" />
    </linearGradient>
    <linearGradient id="routeEmerald" x1="16" y1="36" x2="38" y2="36" gradientUnits="userSpaceOnUse">
      <stop stopColor="#34d399" />
      <stop offset="1" stopColor="#10b981" />
    </linearGradient>
  </defs>

  <!-- Dark Obsidian Squircle Tile -->
  <rect
    width="48"
    height="48"
    rx="12"
    fill="url(#bgGrad)"
    stroke="rgba(255, 255, 255, 0.16)"
    stroke-width="1.5"
  />

  <!-- Stylized Modern 3 Spine -->
  <path
    d="M 14 14 C 14 11 20 10 26 12 C 30 13.5 31 17 28 20 C 25 23 21 24 21 24"
    stroke="#ffffff"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M 21 24 C 23 24 28 24.5 31 28 C 33 31.5 30 36 25 37 C 18 38 14 35 14 32"
    stroke="#ffffff"
    stroke-width="3.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- 3 Pathway Router Nodes -->
  <circle cx="37" cy="13" r="3.2" fill="url(#routeCyan)" />
  <line x1="29" y1="13" x2="33.5" y2="13" stroke="url(#routeCyan)" stroke-width="2" stroke-dasharray="2 1.5" />

  <circle cx="37" cy="24" r="3.2" fill="url(#routeIndigo)" />
  <line x1="22" y1="24" x2="33.5" y2="24" stroke="url(#routeIndigo)" stroke-width="2" stroke-dasharray="2 1.5" />

  <circle cx="37" cy="35" r="3.2" fill="url(#routeEmerald)" />
  <line x1="28" y1="35" x2="33.5" y2="35" stroke="url(#routeEmerald)" stroke-width="2" stroke-dasharray="2 1.5" />
</svg>